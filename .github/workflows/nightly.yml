name: nightly refresh

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: prod-build
  cancel-in-progress: true

jobs:
  refresh:
    name: load and rebuild prod
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
      # databricks token read convention DATABRICKS_TOKEN
      DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: databricks/setup-cli@main

      - name: wake the warehouse
        run: databricks warehouses start "$DATABRICKS_WAREHOUSE_ID" --timeout 20m

      - name: install from the lockfile
        run: uv sync --locked

      - name: pull ctgov since yesterday
        run: make load-ctgov ARGS="--since $(date -u -d yesterday +%F)"

      - name: dbt deps
        run: uv run dbt deps

      - name: source freshness
        run: uv run dbt source freshness --target prod || true

      - name: freshness summary
        if: always()
        run: |
          if [ ! -f target/sources.json ]; then
            echo "No freshness artifact -- the step above did not complete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Source freshness"
            echo ""
            echo "| source | state | hours since newest data |"
            echo "|---|---|---:|"
            jq -r '.results[]
              | "| \(.unique_id | split(".") | .[-2:] | join(".")) | \(.status) | \((.max_loaded_at_time_ago_in_s // 0) / 3600 | floor) |"' \
              target/sources.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: rebuild and test prod
        run: uv run dbt build --target prod
