version: 2

sources:
  - name: drugsfda
    description: >
        Drugs@FDA approved applications — sponsors, products, active ingredients,
        marketing status. Reference data, refreshed as a single bulk file.
    database: raw
    schema: landing
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 14, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: applications
        identifier: drugsfda_applications
        description: >
            Natural key `application_number`. One application nests many products,
            each nesting many active ingredients — the join grain is a real decision.
        columns:
          - name: application_number
            description: >
              FDA application id, the natural key
            data_tests:
              - not_null
          - name: _loaded_at
            description: >
              warehouse arrival time, required for freshness check
            data_tests:
              - not_null
          - name: _batch_id
            data_tests:
              - not_null
